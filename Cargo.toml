[package]
# Port of The Undergarden 0.9.6 (quek, MIT), Minecraft Java 1.21.1 NeoForge; the port targets
# Horizon 26.3 at the pin in horizon-mod.toml. Clean-room Rust rewrite from the mod's behaviour
# (notes.md); local-only until publishing is approved, publishable under the MIT licence with
# this source.
#
# Cargo's name and version are not the mod's identity: horizon-mod.toml is.
name = "undergarden"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "The Undergarden for Horizon: a ceiling dimension with the mod's surfaces and five of its biomes"
publish = false

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build). Any other registry dependency must be
# pinned with `horizon-launcher native-lock .` before building.
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
